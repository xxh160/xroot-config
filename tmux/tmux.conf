# Use Ctrl+A as the prefix; pressing it twice sends Ctrl+A to the application.
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse interaction and retain more scrollback for newly created panes.
set-option -g mouse on
set-option -g history-limit 10000

# Number both windows and panes from 1.
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Use vi keys in copy mode; prefix then v enters it.
set-window-option -g mode-keys vi
bind-key v copy-mode

# Split in the current pane's directory: | left/right, - top/bottom.
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Reload this machine's linked configuration without restarting the server.
bind-key r source-file ~/.tmux.conf \; display-message "reloaded"
